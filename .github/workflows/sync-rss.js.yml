# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: sync-rss

on:
  workflow_dispatch: # manual trigger
  push:
    paths:
      - '.github/workflows/sync-rss.js.yml'
  schedule:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events
    # Runs every 6 hours
    - cron:  '0 */6 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/previous-releases

    env:
      # Full details with one bounded PoW verification, following mtfront's approach.
      DOUBAN_RSS_ONLY: 'false'
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_MOVIE_DATABASE_ID: '3cebb357-cbe5-46a8-bf5f-694b21ba782d'
      NOTION_MUSIC_DATABASE_ID: ${{ secrets.NOTION_MUSIC_DATABASE_ID }}
      NOTION_BOOK_DATABASE_ID: 'd5861526-c8a1-4e51-939f-24bea347b26c'
      NOTION_GAME_DATABASE_ID: ${{ secrets.NOTION_GAME_DATABASE_ID }}
      NOTION_DRAMA_DATABASE_ID: ${{ secrets.NOTION_DRAMA_DATABASE_ID }}
      DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
      NEODB_API_TOKEN: ${{ secrets.NEODB_API_TOKEN }}
      NEODB_VISIBILITY: ${{ vars.NEODB_VISIBILITY || '2' }}

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Verify Notion library access (no Douban requests)
      run: |
        node --input-type=module <<'NODE'
        for (const [category, id] of [['movie', process.env.NOTION_MOVIE_DATABASE_ID], ['book', process.env.NOTION_BOOK_DATABASE_ID]]) {
          const response = await fetch('https://api.notion.com/v1/data_sources/' + id, {
            headers: {'Authorization': 'Bearer ' + process.env.NOTION_TOKEN, 'Notion-Version': '2025-09-03'}
          });
          if (!response.ok) throw new Error(category + ' Notion access check failed: HTTP ' + response.status);
          const data = await response.json();
          const date = category === 'movie' ? '观影日期' : '阅读日期';
          const expected = {
            [category === 'movie' ? '电影名' : '书名']: 'title',
            [date]: 'date', '个人评分': 'select', '状态': 'select',
            '豆瓣链接': 'url', '封面': 'files', '我的短评': 'rich_text',
            '豆瓣评分': 'number',
            ...(category === 'movie'
              ? {'类型': 'multi_select', '制片国家/地区': 'select', '片长': 'rich_text'}
              : {'作者': 'rich_text', '译者': 'rich_text', '原作名': 'rich_text', '页数': 'number'})
          };
          for (const [name, type] of Object.entries(expected)) {
            if (data.properties[name]?.type !== type) {
              throw new Error(category + ' property missing or wrong type: ' + name + ' (expected ' + type + ')');
            }
          }
          if (data.properties['个人评分'].type !== 'select' || data.properties['豆瓣评分'].type !== 'number') {
            throw new Error(category + ' score property types do not match');
          }
          for (let score = 1; score <= 5; score++) {
            if (!data.properties['个人评分'].select.options.some(option => option.name === '⭐'.repeat(score))) {
              throw new Error(category + ' missing star rating option');
            }
          }
          console.log(category + ' library access and schema verified');
        }
        NODE
    - run: npm ci
    - name: Test detail parsing and bounded verification
      run: npx tsx scripts/test-detail.ts
    - name: Verify live movie details from this runner
      if: github.event_name == 'workflow_dispatch'
      run: npx tsx scripts/verify-detail.ts
    - run: npm run sync || exit 1
      if: github.event_name != 'push'
